# Build + deploy otomatis ke Cloudflare Workers setiap ada push ke main.
# Tidak ada lagi langkah `npm run deploy` manual di komputer.
#
# Perlu secret di GitHub (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN    - token "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID   - ID akun Cloudflare
#   VITE_SUPABASE_URL       - URL project Supabase
#   VITE_SUPABASE_ANON_KEY  - anon/publishable key (aman, dilindungi RLS)
#   VITE_R2_PUBLIC_URL      - https://img.abb-form.click
#   SUPABASE_DB_URL         - (opsional) connection string Postgres, supaya
#                             file di supabase/migrations/ ikut dijalankan
#                             otomatis. Kalau kosong, langkah migrasi dilewati.
#
# Catatan: VITE_* ikut ter-bundle ke file JS yang publik — memang begitu
# sifatnya, karena dibaca browser. Yang benar-benar rahasia (service_role key,
# R2 secret key) tidak pernah dipakai di sini.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Wrangler 4 minimal Node 22
          cache: npm

      - run: npm ci

      # Migrasi dijalankan SEBELUM deploy supaya database sudah siap saat
      # kode baru live. Tiap file dicatat di public.schema_migrations, jadi
      # sekali jalan saja walau workflow dipicu berkali-kali.
      - name: Jalankan migrasi Supabase
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL belum diisi — migrasi dilewati."
            exit 0
          fi
          command -v psql >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          }
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c \
            "create table if not exists public.schema_migrations (
               name text primary key,
               applied_at timestamptz not null default now()
             );"
          for f in supabase/migrations/*.sql; do
            [ -e "$f" ] || continue
            n=$(basename "$f")
            if [ "$(psql "$DB_URL" -tAc \
                 "select 1 from public.schema_migrations where name = '$n'")" = "1" ]; then
              echo "sudah pernah dijalankan: $n"
              continue
            fi
            echo "menjalankan: $n"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -1 -f "$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c \
              "insert into public.schema_migrations (name) values ('$n');"
          done

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_R2_PUBLIC_URL: ${{ secrets.VITE_R2_PUBLIC_URL }}
        run: npm run build

      # Sengaja TIDAK memakai cloudflare/wrangler-action: action itu memasang
      # Wrangler versinya sendiri (v3), sedangkan wrangler.jsonc di repo ini
      # memakai `assets` + `not_found_handling` yang baru ada di Wrangler v4.
      # Memanggil wrangler dari package.json menjamin versinya sama persis
      # dengan yang dipakai saat deploy manual.
      - name: Deploy ke Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
